[env:native]
platform          = native
test_framework    = unity
build_src_filter  = +<util/interpolate.cpp> -<*.cpp>
; MSYS2 MinGW64 must be on PATH for gcc/g++ to resolve on Windows.
build_flags       = -I${PROJECT_SRC_DIR}

[env:cyd]
platform  = espressif32 @ ^6.7.0
board     = esp32dev
framework = arduino

; huge_app (3 MB app / ~896 KB FS, no OTA) replaces min_spiffs (1.9 MB app w/
; OTA). Adding the NimBLE stack pushes the image past min_spiffs' 1.9 MB app
; slot; we don't use OTA, so the single large-app layout is the right trade and
; also gives LittleFS more room for the logo cache. NOTE: changing the
; partition table requires a full flash erase on the next upload — cached logos
; and /settings.json are wiped and regenerate on first boot.
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs

monitor_speed = 115200
upload_speed  = 921600
monitor_filters = esp32_exception_decoder

build_flags =
  -D CORE_DEBUG_LEVEL=3
  -D LGFX_USE_V1
  -D LV_CONF_INCLUDE_SIMPLE
  -I include
  -std=gnu++17
build_unflags = -std=gnu++11

lib_deps =
  lovyan03/LovyanGFX            @ ^1.2.0
  lvgl/lvgl                     @ ^9.2.2
  bblanchon/ArduinoJson         @ ^7.2.0
  esp32async/ESPAsyncWebServer  @ ^3.6.0
  esp32async/AsyncTCP           @ ^3.3.2
  ; Pinned to 1.4.x: the 2.x API changed the characteristic/server callback
  ; signatures (NimBLEConnInfo&) that ble_provisioning.cpp is written against.
  h2zero/NimBLE-Arduino         @ ~1.4.2
